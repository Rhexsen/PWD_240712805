<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>If-Else Internal: Wahana Taman Hiburan</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <script type="text/javascript">
        var iTinggi;
        var sDampingi;

        iTinggi = prompt("Masukkan tinggi badan (cm).", 0);
        sDampingi = prompt("Didampingi orang dewasa? (Y)a atau (T)idak", "Y");

        if (iTinggi > 140) {
            if (sDampingi == "Y") {
                alert("Boleh naik wahana ekstrem");
            } else {
                alert("Boleh naik, disarankan didampingi");
            }
        } else {
            if (sDampingi == "Y") {
                alert("Hanya wahana anak (didampingi)");
            } else {
                alert("Tidak boleh naik wahana");
            }
        }
    </script>
</head>

<body>
    <h1>If-Else Internal: Wahana Taman Hiburan</h1>
    <p>Reload halaman untuk mencoba lagi.</p>
</body>

</html>
