<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>Registrasi Perpustakaan Digital</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <script type="text/javascript" src="js/script.js"></script>
</head>

<body>
    <h1>Registrasi Perpustakaan Digital</h1>
    <form action="#" method="post" onsubmit="return fn_ValForm();">
        <p>Nama:<br /><input type="text" id="nama" name="nama" /></p>
        <p>Email:<br /><input type="text" id="email" name="email" /></p>
        <p>Umur:<br /><input type="text" id="umur" name="umur" /></p>
        <p>Koleksi Favorit:<br />
            <select id="kategori" name="kategori">
                <option value="">-- Pilih --</option>
                <option value="F">Fiksi</option>
                <option value="N">Non-Fiksi</option>
                <option value="J">Jurnal Ilmiah</option>
            </select></p>
        <p><input type="submit" value="Daftar" /></p>
    </form>
</body>

</html>
