<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>Form Pendaftaran Seminar (XHTML)</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <script type="text/javascript">
        function fn_ValForm() {
            var sMsg = "";

            if (document.getElementById("nama").value == "") {
                sMsg += "\n* Anda belum mengisikan nama";
            }
            if (document.getElementById("instansi").value == "") {
                sMsg += "\n* Anda belum mengisikan instansi";
            }
            if (document.getElementById("pertanyaan").value == "") {
                sMsg += "\n* Anda belum mengisikan pertanyaan";
            }

            if (sMsg != "") {
                alert("Peringatan:\n" + sMsg);
                return false;
            }else{
                return true;
            }
        }
    </script>
</head>

<body>
    <h1>Form Pendaftaran Seminar</h1>
    <form action="#" method="post" onsubmit="return fn_ValForm();">
        <p>Nama Lengkap:<br /><input type="text" id="nama" name="nama" /></p>
        <p>Asal Instansi:<br /><input type="text" id="instansi" name="instansi" /></p>
        <p>Pertanyaan untuk Pembicara:<br /><textarea id="pertanyaan" name="pertanyaan" rows="4" cols="30"></textarea></p>
        <p><input type="submit" value="Send" /></p>
    </form>
</body>

</html>
