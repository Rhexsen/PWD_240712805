<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>If-Else Internal: Tiket Kereta</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <script type="text/javascript">
        var iJarak;
        var sKelas;

        iJarak = prompt("Masukkan jarak perjalanan (km).", 0);
        sKelas = prompt("Pilih kelas: (E)konomi atau (B)isnis", "E");

        if (iJarak > 100) {
            if (sKelas == "E") {
                alert("Ekonomi jarak jauh: Rp 150.000");
            } else {
                alert("Bisnis jarak jauh: Rp 250.000");
            }
        } else {
            if (sKelas == "E") {
                alert("Ekonomi jarak dekat: Rp 60.000");
            } else {
                alert("Bisnis jarak dekat: Rp 100.000");
            }
        }
    </script>
</head>

<body>
    <h1>If-Else Internal: Tiket Kereta</h1>
    <p>Reload halaman untuk mencoba lagi.</p>
</body>

</html>
