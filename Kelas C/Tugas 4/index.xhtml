<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>Switch-Case: Ruang Perpustakaan</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <script type="text/javascript">
        var sInput;

        sInput = prompt("Pilih ruang: (B)aca, (D)iskusi, (K)omputer, (A)udio Visual", "B");

        switch (sInput) {
            case "B":
                alert("Ruang Baca di lantai 1");
                break;
            case "D":
                alert("Ruang Diskusi di lantai 2");
                break;
            case "K":
                alert("Ruang Komputer di lantai 2");
                break;
            case "A":
                alert("Ruang Audio Visual di lantai 3");
                break;
            default:
                alert("Ruang tidak ditemukan");
        }
    </script>
</head>

<body>
    <h1>Switch-Case: Ruang Perpustakaan</h1>
    <p>Reload halaman untuk mencoba lagi.</p>
</body>

</html>
